[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
# Desktop Performance request -> the GPU/LLM sustained profile (Tuned.md intent:
# Noctalia Performance click activates gpu-sustained). Was throughput-performance,
# which let tuned-ppd override the manual gpu-sustained selection on daemon events.
performance=gpu-sustained

[battery]
# PPD = TuneD
balanced=balanced-battery
