[main]
summary=Sustained GPU/LLM Profile (92C Limit, iGPU Power Priority)
include=balanced

[cpu]
governor=powersave
energy_performance_preference=balance_performance
force_latency=99

[sysfs]
/sys/firmware/acpi/platform_profile=performance
/sys/class/drm/card1/device/power_dpm_force_performance_level=auto

# Override the included 'balanced' base's [acpi] platform_profile=balanced so
# tuned-adm verify passes and there is no flip-flop race between the acpi and
# sysfs plugins on reapply (both now agree on 'performance').
[acpi]
platform_profile=performance

[script]
script=llm_tune.sh
