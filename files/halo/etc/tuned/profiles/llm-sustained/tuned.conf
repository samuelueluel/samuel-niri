[main]
summary=Sustained LLM Inference Profile (92C Thermal Limit, Stock Power, Temp-Governed)
include=balanced

[cpu]
governor=powersave
energy_performance_preference=performance

[sysfs]
/sys/firmware/acpi/platform_profile=performance
/sys/class/drm/card1/device/power_dpm_force_performance_level=auto

[script]
script=llm_tune.sh
