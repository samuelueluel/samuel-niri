name: turquoise-halo
description: Turquoise for the HP ZBook Ultra G1a (Ryzen AI Max+ 395 Strix Halo)
base-image: ghcr.io/ublue-os/base-main # This will change in the future
image-version: latest

# Same software/desktop stack as turquoise (via the shared include below) plus
# Strix Halo hardware enablement. See the hardware notes at:
#   ~/Dropbox/Sam-Obsidian-Vault/30_Personal/20_Personal_Interests/Custom Image/
#   HP ZBook Ultra G1a 14'' Ryzen AI Max+ 395.md
# Section references (doc 3.A, 3.B, etc.) below point at that note.

modules:
  # ── Everything turquoise has ──────────────────────────────────────────────
  - from-file: turquoise-common.yml

  # ── Halo-only static files (separate tree → /) ────────────────────────────
  # Kept out of files/system so nothing here lands in the regular turquoise image.
  - type: files
    files:
      - source: halo
        destination: /

  # ── Kernel arguments (doc 3.A + 5.A.2) ────────────────────────────────────
  # amd_pstate=active: fixes 10–15W idle / warm palm rest (default mode is broken).
  # ttm.pages_limit (4K pages) exposes ~124GB to the iGPU for
  # local LLM inference. Applied on `bootc upgrade`; verify with `rpm-ostree kargs`.
  # NOT added: amd_iommu=off (LLM-perf karg, DMA-isolation tradeoff — verify suspend
  # with `amd-s2idle test` on hardware first); processor.max_cstate=1 (hurts battery).
  - type: kargs
    kargs:
      - amd_pstate=active
      - ttm.pages_limit=32505856

  # ── Webcam kmod — AMD ISP4 ────────────────────────────────────────────────
  # The ISP4 capture driver (amd_isp4_capture) is in-tree in Fedora's kernels
  # (7.1.6+) but NOT in kernel-vanilla COPR builds (verified: no isp4_capture
  # in the 7.1.6/7.1.7/7.1.8 vanilla kernel-modules filelists — only the
  # amd_isp4 platform driver). We run vanilla kernels, so the out-of-tree
  # akmod stays required. Re-disable only once kernel-vanilla ships the
  # driver in-tree.
  - type: script
    scripts:
      - build-isp4-akmod.sh

  # ── Wi-Fi kmod — MT7925 & RyzenAdj ─────────────────────────────────────────
  - type: script
    scripts:
      # - build-isp4-akmod.sh
      - build-mt7925-kmod.sh
      - install-ryzenadj.sh

  # ── sched-ext userspace schedulers (doc 7) ────────────────────────────────
  # scx_lavd / scx_rusty for smooth desktop under heavy Stata/LLM load on the
  # 16-core dual-CCD CPU. Driven by scx_loader (enabled below); default scheduler
  # is set in files/halo/etc/scx_loader.toml. Manage live with `scxctl`.
  - type: dnf
    repos:
      copr:
        - sirlucjan/scx-scheds-cargo
    install:
      install-weak-deps: false
      packages:
        - scx-scheds

  # ── Firmware (doc 3.D / 5.D) ──────────────────────────────────────────────
  # linux-firmware: ensure current (must NOT be the ROCm-breaking 20251125 build).
  # amd-debug-tools (the `amd-s2idle` suspend test, doc 2.C.2) is NOT packaged for
  # Fedora — it's superm1's upstream tool meant to run from a venv. Install on-host
  # when debugging suspend: `pipx install amd-debug-tools` (pipx is already in the image).
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - linux-firmware

  # ── LLM Performance Tuning ────────────────────────────────────────────────
  # tuned and tuned-ppd (replaces power-profiles-daemon) for the 
  # accelerator-performance profile which boosts prompt processing by 5-8%.
  # ryzenadj is installed via install-ryzenadj.sh (rpm --nodeps) to bypass akmod-ryzen_smu.
  - type: dnf
    remove:
      packages:
        - power-profiles-daemon
    install:
      install-weak-deps: false
      packages:
        - tuned
        - tuned-ppd

  # ── Stata GUI dependency ──────────────────────────────────────────────
  # Stata's xstata-mp GUI requires GTK2's X11 backend; not pulled in by default.
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - gtk2

  # ── Enable halo services ──────────────────────────────────────────────────
  # ac-wakeup-disable: stops the AC adapter triggering immediate resume (doc 3.E).
  # scx_loader: D-Bus daemon that loads the scheduler from scx_loader.toml at boot.
  # tuned: dynamically applies kernel tuning profiles.
  - type: systemd
    system:
      enabled:
        - ac-wakeup-disable.service
        - scx_loader.service
        - tuned.service
